[package]
name = "abb-signer"
description = "The separate signer for abb/1: recomputes roots, signs checkpoints, fails closed"
# The signer sits outside core/ on purpose: it is a separate deployable with its
# own key volume, not part of the core library. It still shares the workspace so
# there is exactly one copy of the cryptographic rules.
workspace = "../core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "abb-signer"
path = "src/main.rs"

[lib]
name = "abb_signer"
path = "src/lib.rs"

[dependencies]
abb-jcs.workspace = true
abb-merkle.workspace = true
abb-checkpoint.workspace = true
abb-event.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
tiny_http.workspace = true

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
