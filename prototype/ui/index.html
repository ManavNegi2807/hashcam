<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Black Box</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #111; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input { flex: 1; min-width: 200px; padding: 8px; font-size: 14px; }
  button { padding: 8px 12px; font-size: 14px; border: 1px solid #888; background: #fff; border-radius: 6px; cursor: pointer; }
  #banner { padding: 12px; border-radius: 8px; font-weight: 600; margin-bottom: 12px; background: #e5e7eb; }
  #banner.ok { background: #d1f5d8; color: #0b5d1e; }
  #banner.bad { background: #fbd5d5; color: #8a1212; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th, td { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; word-break: break-word; }
</style>
</head>
<body>
<h1>Agent Black Box</h1>

<div class="row">
  <input id="run" placeholder="run ID">
  <button onclick="load()">Load</button>
  <button onclick="verify()">Verify</button>
</div>

<div class="row">
  <button onclick="tamper('edit')">Tamper: edit</button>
  <button onclick="tamper('delete')">Tamper: delete</button>
  <button onclick="tamper('truncate')">Tamper: truncate</button>
</div>

<div id="banner">Run ID daalo, phir Load dabao.</div>
<div class="table-wrap"><table id="tbl"></table></div>

<script>
  const $ = (id) => document.getElementById(id);

  function show(kind, text) {
    const b = $('banner');
    b.textContent = text;          // textContent: log ka text HTML ban kar nahi chalega
    b.className = kind;            // "ok" = green, "bad" = red, "" = neutral
  }

  function runUrl(path) {
    return `/api/runs/${encodeURIComponent($('run').value.trim())}/${path}`;
  }

  async function load() {
    try {
      const r = await fetch(runUrl('entries'));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const rows = await r.json();
      const t = $('tbl');
      t.innerHTML = '';
      const head = t.insertRow();
      ['#', 'Action', 'Result', 'Hash'].forEach((h) => {
        const th = document.createElement('th');
        th.textContent = h;
        head.appendChild(th);
      });
      rows.forEach((row) => {
        const tr = t.insertRow();
        [row.n, row.action, row.result, (row.hash || '').slice(0, 8)].forEach((v) => {
          tr.insertCell().textContent = String(v);
        });
      });
      show('', `${rows.length} steps load hue`);
    } catch (e) {
      show('bad', 'Load nahi hua: ' + e.message);
    }
  }

  async function verify() {
    try {
      const r = await fetch(runUrl('verify'));
      const v = await r.json();
      show(v.ok ? 'ok' : 'bad', (v.ok ? 'GREEN: ' : 'RED: ') + v.message);
    } catch (e) {
      show('bad', 'Verify nahi hua: ' + e.message);
    }
  }

  async function tamper(kind) {
    try {
      const r = await fetch(runUrl('tamper/' + kind), { method: 'POST' });
      const v = await r.json();
      show(v.ok ? 'ok' : 'bad', `Tamper (${kind}) par verifier: ` + (v.ok ? 'GREEN ' : 'RED ') + v.message);
    } catch (e) {
      show('bad', 'Tamper nahi hua: ' + e.message);
    }
  }
</script>
</body>
</html>
