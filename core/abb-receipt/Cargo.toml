[package]
name = "abb-receipt"
description = "Receipt format, container and verification for abb/1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
abb-jcs.workspace = true
abb-merkle.workspace = true
abb-checkpoint.workspace = true
abb-event.workspace = true
abb-verify.workspace = true
sha2.workspace = true
# Receipts are a ZIP by D-04. Only deflate is enabled: fewer formats to parse
# means less attack surface in the one tool an outsider feeds a file to.
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
ed25519-dalek.workspace = true

[lints]
workspace = true
