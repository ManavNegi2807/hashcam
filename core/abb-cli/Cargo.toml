[package]
name = "abb-cli"
description = "The abb command line: canonicalization, tree utilities, keys, vectors, verify-global"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "abb"
path = "src/main.rs"

[lib]
name = "abb_cli"
path = "src/lib.rs"

[dependencies]
abb-jcs.workspace = true
abb-merkle.workspace = true
abb-checkpoint.workspace = true
abb-event.workspace = true
sha2.workspace = true
abb-verify.workspace = true
abb-receipt.workspace = true
# For the signer request layout of D-20, so `abb attest` and the signer
# cannot disagree about what a request looks like.
abb-signer = { path = "../../signer" }
ed25519-dalek.workspace = true
getrandom.workspace = true

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
