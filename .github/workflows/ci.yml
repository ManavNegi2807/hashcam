# CI stages follow TESTING.md section 13. A stage whose code does not exist yet
# says so instead of reporting a pass it never ran.
name: ci

on:
  push:
  pull_request:

jobs:
  python-lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy services vectors/tools tests conftest.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a key-like file is tracked
        run: |
          if git ls-files | grep -E '(^|/)secrets/|\.pem$|\.key$|^\.env$'; then
            echo "key-like file tracked"; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest PyYAML
      # Includes the rule that the signer's key volume is mounted nowhere else
      # (R-OPS-03).
      - run: pytest -q tests/security
      - run: python tools/check_key_volume_isolation.py

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The conformance vectors must pass in Rust, not only in Python
      # (PROTOCOL.md section 17, R-PRO-01).
      - run: cargo run -q -p abb-cli -- vectors check

  contract-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: abb
          POSTGRES_PASSWORD: abb
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The service canonicalizes through the Rust core, so the binary is a
      # test dependency, not an optional extra.
      - run: cargo build -p abb-cli -p abb-signer --manifest-path core/Cargo.toml
      - name: Contract tests against a real PostgreSQL and a running signer
        env:
          ABB_TEST_DSN: postgresql://abb:abb@127.0.0.1:5432/postgres
          ABB_BIN: core/target/debug/abb
          ABB_SIGNER_BIN: core/target/debug/abb-signer
        run: pytest -q tests/contract
      - name: Signer fault injection (fails closed on a corrupt state log)
        env:
          ABB_BIN: core/target/debug/abb
          ABB_SIGNER_BIN: core/target/debug/abb-signer
        run: pytest -q tests/fault
      # The tamper suite includes two end-to-end Playwright receipt tests.
      # Install Chromium before that suite, not later in the browser-test step.
      - name: Install Chromium for receipt tests
        run: python -m playwright install --with-deps chromium
      # The core promise: every way of altering history, caught and named.
      - name: Tamper suite (TESTING.md section 4)
        env:
          ABB_TEST_DSN: postgresql://abb:abb@127.0.0.1:5432/postgres
          ABB_BIN: core/target/debug/abb
          ABB_SIGNER_BIN: core/target/debug/abb-signer
        run: pytest -q tests/tamper
      # The demo is also a smoke test: it exits non-zero if any beat misbehaves.
      - name: End-to-end demo
        env:
          ABB_TEST_DSN: postgresql://abb:abb@127.0.0.1:5432/postgres
          ABB_BIN: core/target/debug/abb
          ABB_SIGNER_BIN: core/target/debug/abb-signer
        run: python tools/demo.py --dsn postgresql://abb:abb@127.0.0.1:5432/postgres
      - name: End-to-end demo, with the second-device labels (a simulation, printed as one)
        env:
          ABB_BIN: core/target/debug/abb
          ABB_SIGNER_BIN: core/target/debug/abb-signer
        run: python tools/demo.py --dsn postgresql://abb:abb@127.0.0.1:5432/postgres --simulate-second-device
      # Advisory channels (semantic, prompt guard, anomaly, TinyFish mock) need no browser.
      - name: Advisory channels and the TinyFish mock
        run: pytest -q tests/security tests/adapter/test_tinyfish_mocked.py
      # Step 7 and the dashboard need a real Chromium. Not yet run in CI: see the plan.
      - name: Browser tests (Playwright adapter, bypass probes, dashboard with axe)
        env:
          ABB_TEST_DSN: postgresql://abb:abb@127.0.0.1:5432/postgres
          ABB_BIN: core/target/debug/abb
          ABB_SIGNER_BIN: core/target/debug/abb-signer
        run: pytest -q tests/adapter tests/ui
      - name: Gated Playwright demo (measured coverage, then verify offline)
        env:
          ABB_BIN: core/target/debug/abb
          ABB_SIGNER_BIN: core/target/debug/abb-signer
        run: python tools/demo_playwright.py --dsn postgresql://abb:abb@127.0.0.1:5432/postgres

  prototype:
    # The original prototype keeps its own 25 tests, run as it ran before v10.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r prototype/requirements.txt
      - run: python -m pytest -q tests
        working-directory: prototype

  cross-language-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements-dev.txt
      - run: cargo build -p abb-cli --manifest-path core/Cargo.toml
      # Regenerating the vectors must not change a byte: the Python reference
      # and the frozen files must agree.
      - run: |
          find vectors -name '*.json' | sort | xargs sha256sum > /tmp/before.txt
          python vectors/tools/generate.py
          find vectors -name '*.json' | sort | xargs sha256sum > /tmp/after.txt
          diff /tmp/before.txt /tmp/after.txt

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config is at least well formed
        run: |
          mkdir -p deploy/secrets
          head -c 24 /dev/urandom | base64 > deploy/secrets/postgres_password
          docker compose -f deploy/docker-compose.yml --profile core config >/dev/null
      # Starting the stack from a fresh checkout is not verified yet
      # (R-OPS-01, TESTING.md 14). Add `up --build` here once it is.
